worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # "api" is the compose service name. Docker's DNS returns one address per
    # running container and nginx balances across them round-robin.
    upstream engagement_api {
        server api:8000;
        keepalive 64;
    }

    server {
        listen 80;
        client_max_body_size 300m;      # bulk image uploads

        location / {
            proxy_pass http://engagement_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
    }
}
