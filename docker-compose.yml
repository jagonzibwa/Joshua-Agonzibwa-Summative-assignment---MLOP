# Scaled deployment: N API containers behind an nginx load balancer.
#
#   docker compose up -d --build --scale api=1     # one container
#   docker compose up -d --scale api=4             # four containers
#   open http://localhost:8080
#
# Every API container is limited to one CPU and one TensorFlow thread, so adding
# containers is what adds capacity. They share the data and model volumes: a
# model promoted by a retraining run in one container is hot-reloaded by the
# others (they watch the model file's modification time).
services:
  api:
    build: .
    image: engagewatch:latest
    environment:
      TF_THREADS: "1"
      PORT: "8000"
    expose:
      - "8000"
    volumes:
      - engage_data:/app/data
      - engage_models:/app/models
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2500M
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engage_data:
  engage_models:
